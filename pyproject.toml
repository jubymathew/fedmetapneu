[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedmetapneu"
version = "0.1.0"
description = "Metaheuristic optimisation of privacy-preserving federated learning for pneumonia screening on chest radiographs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Juby Mathew", email = "jubymathew@amaljyothi.ac.in" }]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "opacus>=1.4",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
timm = ["timm>=0.9"]
dicom = ["pydicom>=2.4"]
dev = ["pytest>=7", "ruff>=0.4"]
all = ["timm>=0.9", "pydicom>=2.4", "pytest>=7", "ruff>=0.4"]

[project.scripts]
fedmetapneu = "fedmetapneu.cli:main"

[tool.setuptools.packages.find]
include = ["fedmetapneu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E741"]
